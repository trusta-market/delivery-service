# K8s 환경 전용 override (SPRING_PROFILES_ACTIVE=k8s 일 때만 로드).

server:
  port: 8202

spring:
  main:
    allow-bean-definition-overriding: true

  config:
    import: "optional:configserver:http://config-server"

  cloud:
    config:
      uri: http://config-server
      label: develop
      fail-fast: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/trusta_market
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  liquibase:
    default-schema: p_delivery
    liquibase-schema: p_delivery

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: p_delivery
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  kafka:
    bootstrap-servers: kafka.kafka:9092
    listener:
      ack-mode: manual
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

delivery:
  batch:
    am-cron: "*/5 * * * * *"
    pm-cron: "-"
  outbox:
    scheduler-cron: "*/10 * * * * *"

trusta:
  security:
    trust-gateway-headers: true
