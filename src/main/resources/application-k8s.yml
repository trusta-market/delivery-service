# K8s 환경 전용 override (SPRING_PROFILES_ACTIVE=k8s 일 때만 로드).

server:
  port: 8202

spring:
  main:
    # common 의 JpaConfig.jpaAuditingHandler 와 delivery 자체 JpaAuditingConfig 의 동일 빈 충돌 회피.
    allow-bean-definition-overriding: true
  config:
    import: "optional:configserver:http://config-server"
  cloud:
    config:
      uri: http://config-server
      label: develop
      fail-fast: false
  datasource:
    url: jdbc:postgresql://postgres:5432/trusta_market
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: p_delivery
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  # Kafka — GKE namespace 'kafka' 의 StatefulSet 3 broker.
  # 현재 DEV 브랜치 사용 없음.
  # dependency 가 spring-kafka 라 auto-config 가 localhost:9092 로
  # fallback 하는 거 막고, 향후 listener 도입 대비.
  kafka:
    bootstrap-servers: kafka.kafka:9092
    listener:
      ack-mode: manual
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# DeliveryBatchScheduler 의 @Scheduled placeholder. config-repo 에 -k8s.yml 없어서
# k8s 프로필이 값 못 받음. prod 와 동일 cron 값 박음 (매일 9시, 14시).
delivery:
  batch:
    am-cron: "0 0 9 * * *"
    pm-cron: "0 0 14 * * *"
